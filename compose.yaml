name: manager-library-3145555

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-library}
      POSTGRES_DB: library
      TZ: UTC
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library -d library"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - library-net
    restart: unless-stopped

  api:
    build:
      context: ../test-manager-library-3145555-api
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_LOCALE: es
      APP_URL: http://localhost:${API_PORT:-8000}
      APP_KEY: ${APP_KEY:-}
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: library
      DB_USERNAME: library
      DB_PASSWORD: ${POSTGRES_PASSWORD:-library}
      DB_SEARCH_PATH: "library, public"
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-3145555}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin!2026}
      CORS_ORIGIN: http://localhost:${PAGE_PORT:-8081},http://localhost:${APP_PORT:-5173},http://localhost:8080,http://localhost:5173
      COVERS_DIR: /var/www/html/var/covers
      TZ: UTC
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ../test-manager-library-3145555-api:/var/www/html
      - covers:/var/www/html/var/covers
    depends_on:
      db:
        condition: service_healthy
    networks:
      - library-net
    restart: unless-stopped

  app:
    build:
      context: ../test-manager-library-3145555-app
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}/api/v1
    ports:
      - "${APP_PORT:-5173}:${APP_CONTAINER_PORT:-80}"
    depends_on:
      - api
    networks:
      - library-net
    restart: unless-stopped

  page:
    image: nginx:alpine
    ports:
      - "${PAGE_PORT:-8081}:80"
    volumes:
      - ../test-manager-library-3145555-page:/usr/share/nginx/html:ro
    networks:
      - library-net
    restart: unless-stopped

volumes:
  db-data:
    name: library-db-data
  covers:
    name: library-covers

networks:
  library-net:
    name: library-net
